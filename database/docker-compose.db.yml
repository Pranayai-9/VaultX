version: '3.8'

# ==============================================================================
# VaultX NIDS - Security Data Foundation Stack
# Bharat Electronics Components Pvt. Ltd. (BECPL), Pune
#
# Components:
#   1. security-db: PostgreSQL 15 partitioned security events & relational store
#   2. redis-streams: High-throughput event broker & stream queue
#   3. minio-storage: S3-compatible cold object storage for PCAP & archives
# ==============================================================================

networks:
  vaultx-sec-net:
    name: vaultx-sec-net
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.70.0/24
          gateway: 10.10.70.1

volumes:
  vaultx_pg_data:
    name: vaultx_pg_data
  vaultx_redis_data:
    name: vaultx_redis_data
  vaultx_minio_data:
    name: vaultx_minio_data

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL 15 Security Database
  # ----------------------------------------------------------------------------
  security-db:
    image: postgres:15-alpine
    container_name: vaultx-security-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vaultx_nids}
      POSTGRES_USER: ${POSTGRES_USER:-vaultx_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-VaultX_SecAdmin_2026!}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: Asia/Kolkata
    volumes:
      - vaultx_pg_data:/var/lib/postgresql/data
      - ./schema/01_core_tables.sql:/docker-entrypoint-initdb.d/01_core_tables.sql:ro
      - ./schema/02_time_series_tables.sql:/docker-entrypoint-initdb.d/02_time_series_tables.sql:ro
      - ./schema/03_incident_tables.sql:/docker-entrypoint-initdb.d/03_incident_tables.sql:ro
      - ./schema/04_indexes.sql:/docker-entrypoint-initdb.d/04_indexes.sql:ro
      - ./schema/05_seed_data.sql:/docker-entrypoint-initdb.d/05_seed_data.sql:ro
      - ./init/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    ports:
      - "5432:5432"
    networks:
      vaultx-sec-net:
        ipv4_address: 10.10.70.20
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vaultx_admin} -d ${POSTGRES_DB:-vaultx_nids}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ----------------------------------------------------------------------------
  # 2. Redis Streams Message Queue & Pipeline Broker
  # ----------------------------------------------------------------------------
  redis-streams:
    image: redis:7-alpine
    container_name: vaultx-redis-streams
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-VaultX_RedisStream_2026!}
      --maxmemory 1gb
      --maxmemory-policy noeviction
      --appendonly yes
      --appendfsync everysec
    volumes:
      - vaultx_redis_data:/data
    ports:
      - "6379:6379"
    networks:
      vaultx-sec-net:
        ipv4_address: 10.10.70.25
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-VaultX_RedisStream_2026!}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ----------------------------------------------------------------------------
  # 3. MinIO S3-Compatible Object Store (Cold Archive & PCAP Storage)
  # ----------------------------------------------------------------------------
  minio-storage:
    image: minio/minio:latest
    container_name: vaultx-minio-storage
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-vaultx_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-VaultX_MinioKey_2026!}
      TZ: Asia/Kolkata
    volumes:
      - vaultx_minio_data:/data
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # MinIO Web Console
    networks:
      vaultx-sec-net:
        ipv4_address: 10.10.70.35
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
