# =============================================================================
# VaultX Linux auditd Rules for BECPL Servers & Engineering Nodes
# Bharat Electronics Components Pvt. Ltd., Pune
# Path: /etc/audit/rules.d/audit.rules
# =============================================================================

# Remove any existing rules
-D

# Increase kernel audit buffer size (prevent dropped audit events during load)
-b 8192

# Failure mode: 1 = printk log, 2 = kernel panic (use 1 for production servers)
-f 1

# Rate limit per second (0 = unlimited)
-r 0

# -----------------------------------------------------------------------------
# 1. Privileged Command Execution (sudo, su, setuid/setgid binaries)
# -----------------------------------------------------------------------------
-a always,exit -F path=/usr/bin/sudo -F perm=x -F auid>=1000 -F auid!=unset -k priv_cmd_sudo
-a always,exit -F path=/usr/bin/su -F perm=x -F auid>=1000 -F auid!=unset -k priv_cmd_su
-a always,exit -F path=/usr/bin/pkexec -F perm=x -F auid>=1000 -F auid!=unset -k priv_cmd_pkexec
-a always,exit -F path=/usr/sbin/useradd -F perm=x -k user_management
-a always,exit -F path=/usr/sbin/userdel -F perm=x -k user_management
-a always,exit -F path=/usr/sbin/usermod -F perm=x -k user_management

# -----------------------------------------------------------------------------
# 2. Network Socket Creation & Inbound/Outbound Connections
# -----------------------------------------------------------------------------
# 64-bit systems
-a always,exit -F arch=b64 -S socket,connect,bind,accept -F success=1 -F auid>=1000 -F auid!=unset -k net_socket_activity
# 32-bit compatibility
-a always,exit -F arch=b32 -S socket,connect,bind,accept -F success=1 -F auid>=1000 -F auid!=unset -k net_socket_activity

# -----------------------------------------------------------------------------
# 3. Sensitive File Access & Credentials Protection
# -----------------------------------------------------------------------------
# User accounts and credentials
-w /etc/passwd -p wa -k identity_passwd_mod
-w /etc/shadow -p rwa -k identity_shadow_access
-w /etc/group -p wa -k identity_group_mod
-w /etc/gshadow -p rwa -k identity_gshadow_access
-w /etc/security/opasswd -p rwa -k identity_opasswd_mod

# SSH Configuration and Keys
-w /etc/ssh/sshd_config -p rwa -k sshd_config_change
-w /root/.ssh -p rwa -k root_ssh_keys
-w /etc/ssl -p wa -k ssl_cert_tamper

# Sudoers configuration
-w /etc/sudoers -p wa -k sudoers_tamper
-w /etc/sudoers.d/ -p wa -k sudoers_tamper

# -----------------------------------------------------------------------------
# 4. Scheduled Tasks & Persistence (Cron, Systemd, Anacron)
# -----------------------------------------------------------------------------
-w /etc/cron.allow -p wa -k cron_tamper
-w /etc/cron.deny -p wa -k cron_tamper
-w /etc/cron.d/ -p wa -k cron_tamper
-w /etc/cron.daily/ -p wa -k cron_tamper
-w /etc/cron.hourly/ -p wa -k cron_tamper
-w /etc/cron.monthly/ -p wa -k cron_tamper
-w /etc/cron.weekly/ -p wa -k cron_tamper
-w /etc/crontab -p wa -k cron_tamper
-w /var/spool/cron/ -p wa -k cron_tamper
-w /etc/systemd/system/ -p wa -k systemd_service_tamper
-w /etc/init.d/ -p wa -k init_script_tamper

# -----------------------------------------------------------------------------
# 5. Kernel Module Loading and Unloading (Rootkit / Driver Tampering)
# -----------------------------------------------------------------------------
-a always,exit -F arch=b64 -S init_module,finit_module,delete_module -k kernel_module_tamper
-a always,exit -F arch=b32 -S init_module,finit_module,delete_module -k kernel_module_tamper
-w /sbin/insmod -p x -k kernel_module_exec
-w /sbin/rmmod -p x -k kernel_module_exec
-w /sbin/modprobe -p x -k kernel_module_exec

# -----------------------------------------------------------------------------
# 6. Authentication Events & Session Activity
# -----------------------------------------------------------------------------
-w /var/log/faillog -p wa -k auth_failures
-w /var/log/lastlog -p wa -k auth_logins
-w /var/run/utmp -p wa -k session_tracking
-w /var/log/wtmp -p wa -k session_tracking
-w /var/log/btmp -p wa -k session_tracking

# Make the audit configuration immutable until next system reboot
-e 2
